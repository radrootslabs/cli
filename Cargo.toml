[package]
name = "radroots_cli"
version = "0.1.0"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
description = "Radroots command-line interface for accounts, listings, trades, and sync"

[[bin]]
name = "radroots"
path = "src/main.rs"

[workspace]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
test-fixture-geonames-asset = ["radroots_sdk/geonames"]

[dependencies]
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
radroots_authority = { version = "=0.1.0-alpha", default-features = false, features = ["std"] }
radroots_core = { version = "=0.1.0-alpha", features = ["std", "serde"] }
radroots_event = "=0.1.0-alpha"
radroots_event_codec = { version = "=0.1.0-alpha", features = ["json"] }
radroots_identity = "=0.1.0-alpha"
radroots_runtime_store = "=0.1.0-alpha"
radroots_log = "=0.1.0-alpha"
radroots_mesh = { version = "=0.1.0-alpha", default-features = false }
radroots_nostr_accounts = { version = "=0.1.0-alpha", features = ["os-keyring"] }
radroots_nostr = { version = "=0.1.0-alpha", features = ["events"] }
radroots_nostr_connect = "=0.1.0-alpha"
radroots_nostr_signer = "=0.1.0-alpha"
radroots_protected_store = { version = "=0.1.0-alpha", features = ["std"] }
radroots_replica_store = "=0.1.0-alpha"
radroots_replica_schema = "=0.1.0-alpha"
radroots_replica_sync = { version = "=0.1.0-alpha", features = ["legacy-ingest"] }
radroots_transport = { version = "=0.1.0-alpha", default-features = false }
radroots_transport_nostr = { version = "=0.1.0-alpha", default-features = false }
radroots_runtime = "=0.1.0-alpha"
radroots_runtime_contract_v1 = "=0.1.0-alpha"
radroots_runtime_paths = "=0.1.0-alpha"
radroots_sdk = { version = "=0.1.0-alpha", features = ["full"] }
radroots_secret_vault = { version = "=0.1.0-alpha", features = ["std", "os-keyring"] }
radroots_sql_core = { version = "=0.1.0-alpha", features = ["native"] }
radroots_trade = "=0.1.0-alpha"
radroots_protocol = "=0.1.0-alpha"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"
flate2 = "1"
nostr = { version = "0.44.2", features = ["nip44"] }
radroots_outbox = "=0.1.0-alpha"
tar = "0.4"
tempfile = "3.17"
tungstenite = "0.26.2"
