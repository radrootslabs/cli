[package]
name = "radroots_cli"
version = "0.1.0"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
description = "Radroots command-line interface for accounts, listings, trades, and sync"
readme = "README"
homepage = "https://radroots.org"
repository = "https://github.com/radrootslabs/cli"

[[bin]]
name = "radroots"
path = "src/main.rs"

[workspace]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
test-fixture-geonames-asset = ["radroots/geonames"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
radroots = { git = "https://github.com/radrootslabs/sdk.git", rev = "2abc7f5c370201d18306f3e97c01fd98be557036", version = "=0.1.0-alpha" }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.0"
