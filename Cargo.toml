[package]
name = "radroots_cli"
version = "0.1.1"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.0"
license = "GPL-3.0-or-later"
description = "Radroots command-line interface for accounts, listings, trades, and sync"

[[bin]]
name = "radroots"
path = "src/main.rs"

[workspace]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = []
test-fixture-geonames-asset = ["radroots_sdk/test-fixture-geonames-asset"]

[dependencies]
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
radroots_authority = { path = "../lib/crates/authority", version = "=1.0.0-alpha.1", default-features = false, features = ["std", "local_signer"] }
radroots_core = { path = "../lib/crates/core", version = "=1.0.0-alpha.1", features = ["std", "serde"] }
radroots_event = { path = "../lib/crates/event", version = "=1.0.0-alpha.1" }
radroots_event_codec = { path = "../lib/crates/event_codec", version = "=1.0.0-alpha.1", features = ["nostr", "serde_json"] }
radroots_identity = { path = "../lib/crates/identity", version = "=1.0.0-alpha.1" }
radroots_runtime_store = { path = "../lib/crates/runtime_store", version = "=1.0.0-alpha.1" }
radroots_log = { path = "../lib/crates/log", version = "=1.0.0-alpha.1" }
radroots_mesh = { path = "../lib/crates/mesh", version = "=1.0.0-alpha.1", default-features = false }
radroots_nostr_accounts = { path = "../lib/crates/nostr_accounts", version = "=1.0.0-alpha.1", features = ["os-keyring"] }
radroots_nostr = { path = "../lib/crates/nostr", version = "=1.0.0-alpha.1", features = ["client", "events"] }
radroots_nostr_connect = { path = "../lib/crates/nostr_connect", version = "=1.0.0-alpha.1" }
radroots_nostr_signer = { path = "../lib/crates/nostr_signer", version = "=1.0.0-alpha.1" }
radroots_protected_store = { path = "../lib/crates/protected_store", version = "=1.0.0-alpha.1", features = ["std"] }
radroots_replica_store = { path = "../lib/crates/replica_store", version = "=1.0.0-alpha.1" }
radroots_replica_schema = { path = "../lib/crates/replica_schema", version = "=1.0.0-alpha.1" }
radroots_replica_sync = { path = "../lib/crates/replica_sync", version = "=1.0.0-alpha.1" }
radroots_transport = { path = "../lib/crates/transport", version = "=1.0.0-alpha.1", default-features = false }
radroots_transport_nostr = { path = "../lib/crates/transport_nostr", version = "=1.0.0-alpha.1", default-features = false, features = [
  "runtime-tokio",
] }
radroots_runtime = { path = "../lib/crates/runtime", version = "=1.0.0-alpha.1" }
radroots_runtime_contract_v1 = { path = "../sdk/crates/runtime_contract_v1" }
radroots_runtime_paths = { path = "../lib/crates/runtime_paths", version = "=1.0.0-alpha.1" }
radroots_sdk = { path = "../sdk/crates/sdk", features = ["local-runtime-radrootsd-execution", "transport-nostr-runtime"] }
radroots_secret_vault = { path = "../lib/crates/secret_vault", version = "=1.0.0-alpha.1", features = ["std", "os-keyring"] }
radroots_sql_core = { path = "../lib/crates/sql_core", version = "=1.0.0-alpha.1", features = ["native"] }
radroots_trade = { path = "../lib/crates/trade", version = "=1.0.0-alpha.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"
flate2 = "1"
nostr = { version = "0.44.2", features = ["nip44"] }
radroots_outbox = { path = "../lib/crates/outbox", version = "=1.0.0-alpha.1" }
tar = "0.4"
tempfile = "3.17"
tungstenite = "0.26.2"
